name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Tekshiruv
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Paketlarni o'rnatish
        run: npm ci

      - name: Tiplarni tekshirish
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Testlar
        run: npm test

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          NEXTAUTH_SECRET: ci-uchun-soxta-kalit
          NEXTAUTH_URL: http://localhost:3000